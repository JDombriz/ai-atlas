name: Enlaces

on:
  schedule:
    - cron: '0 6 * * 1'   # lunes, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar enlaces
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --exclude-mail
            --exclude-path './templates/**'
            --exclude-path './.github/**'
            --accept 200,206,429
            './**/*.md'
          fail: false

      - name: Abrir issue con los enlaces caídos
        if: env.lychee_exit_code != '0'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Enlaces caídos en la comprobación semanal
          content-filepath: ./lychee/out.md
          labels: mantenimiento,enlaces